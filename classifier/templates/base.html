{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}MNIST Classifier{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="{% block bodyclass %}{% endblock %}">
  <div class="shell">
    <div class="topbar">
      <!--
        These use Django's named-url patterns confirmed from the live
        server's 404 debug page: name='home' for "/" and name='mock_result'
        for "/mock/". If Pri renames either route later, these links keep
        working automatically -- no changes needed here.
      -->
      <a class="wordmark" href="{% url 'home' %}">mnist<span>//</span>classifier</a>
      <nav class="topnav">
        <a href="{% url 'home' %}" class="{% block navwriteup %}{% endblock %}">write-up</a>
        <a href="{% url 'mock_result' %}" class="{% block navclassify %}{% endblock %}">classify a digit</a>
        {% if user.is_authenticated %}
        <form method="post" action="/accounts/logout/">
          {% csrf_token %}
          <button type="submit" class="linklike">log out ({{ user.username }})</button>
        </form>
        {% endif %}
      </nav>
    </div>

    {% block content %}{% endblock %}

    <footer class="sitefoot">
      <span>Group Project 1 -- Image Classification</span>
      <span><a href="https://github.com/MichaelG-B/mnist-classifier">source on GitHub</a></span>
    </footer>
  </div>
</body>
</html>
